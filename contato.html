<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Centric Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { darkblue: '#0A1F44', blue: '#2F80ED', purple: '#7B61FF' }, fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Poppins', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans pt-20">

    <header class="fixed top-0 w-full z-50 bg-darkblue shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                    <i data-lucide="hexagon" class="text-blue w-8 h-8"></i>
                    <span class="font-heading font-bold text-2xl text-white tracking-tight">Centric.</span>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition font-medium">Home</a>
                    <a href="sobre.html" class="text-gray-300 hover:text-white transition font-medium">Sobre</a>
                    <a href="servicos.html" class="text-gray-300 hover:text-white transition font-medium">Serviços</a>
                    <a href="blog.html" class="text-gray-300 hover:text-white transition font-medium">Blog</a>
                    <a href="contato.html" class="text-white hover:text-blue transition font-medium">Contato</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="py-20 bg-white min-h-[calc(100vh-80px)] flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <div class="grid md:grid-cols-2 gap-16">
                <div>
                    <h1 class="text-4xl font-heading font-bold text-darkblue mb-4">Fale com um Especialista</h1>
                    <p class="text-lg text-gray-600 mb-8">Preencha o formulário e nossa equipe entrará em contato para agendar um diagnóstico gratuito da sua infraestrutura.</p>
                    
                    <div class="space-y-6">
                        <div class="flex items-center gap-4 text-gray-700">
                            <div class="w-12 h-12 bg-blue/10 rounded-full flex items-center justify-center text-blue"><i data-lucide="phone"></i></div>
                            <div>
                                <h4 class="font-bold">Telefone / WhatsApp</h4>
                                <p>+55 (11) 4000-0000</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-gray-700">
                            <div class="w-12 h-12 bg-purple/10 rounded-full flex items-center justify-center text-purple"><i data-lucide="mail"></i></div>
                            <div>
                                <h4 class="font-bold">E-mail</h4>
                                <p>contato@centricsolutions.com.br</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 p-8 rounded-2xl shadow-sm border border-gray-100">
                    <form action="#" method="POST" class="space-y-4" id="contactForm">
                        <div>
                            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue focus:border-blue outline-none transition">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail Corporativo *</label>
                            <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue focus:border-blue outline-none transition">
                        </div>
                        <div>
                            <label for="empresa" class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
                            <input type="text" id="empresa" name="empresa" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue focus:border-blue outline-none transition">
                        </div>
                        <div>
                            <label for="mensagem" class="block text-sm font-medium text-gray-700 mb-1">Como podemos ajudar?</label>
                            <textarea id="mensagem" name="mensagem" rows="4" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue focus:border-blue outline-none transition resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-blue hover:bg-blue-600 text-white font-bold py-4 rounded-lg transition shadow-lg shadow-blue/30">
                            Enviar Solicitação
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Mensagem enviada com sucesso! Em breve um especialista entrará em contato.');
            e.target.reset();
        });
    </script>
</body>
</html>
